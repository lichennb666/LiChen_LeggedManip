go2_piper_gazebo:
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 1000

  # Leg controllers (12)
  FL_hip_controller:
    type: effort_controllers/JointPositionController
    joint: FL_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}
  FL_thigh_controller:
    type: effort_controllers/JointPositionController
    joint: FL_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}
  FL_calf_controller:
    type: effort_controllers/JointPositionController
    joint: FL_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  FR_hip_controller:
    type: effort_controllers/JointPositionController
    joint: FR_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}
  FR_thigh_controller:
    type: effort_controllers/JointPositionController
    joint: FR_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}
  FR_calf_controller:
    type: effort_controllers/JointPositionController
    joint: FR_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  RL_hip_controller:
    type: effort_controllers/JointPositionController
    joint: RL_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}
  RL_thigh_controller:
    type: effort_controllers/JointPositionController
    joint: RL_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}
  RL_calf_controller:
    type: effort_controllers/JointPositionController
    joint: RL_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  RR_hip_controller:
    type: effort_controllers/JointPositionController
    joint: RR_hip_joint
    pid: {p: 100.0, i: 0.0, d: 5.0}
  RR_thigh_controller:
    type: effort_controllers/JointPositionController
    joint: RR_thigh_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}
  RR_calf_controller:
    type: effort_controllers/JointPositionController
    joint: RR_calf_joint
    pid: {p: 300.0, i: 0.0, d: 8.0}

  # Arm controllers (6)
  joint1_controller:
    type: effort_controllers/JointPositionController
    joint: joint1
    pid: {p: 50.0, i: 0.0, d: 3.0}
  joint2_controller:
    type: effort_controllers/JointPositionController
    joint: joint2
    pid: {p: 50.0, i: 0.0, d: 2.0}
  joint3_controller:
    type: effort_controllers/JointPositionController
    joint: joint3
    pid: {p: 80.0, i: 0.0, d: 3.0}
  joint4_controller:
    type: effort_controllers/JointPositionController
    joint: joint4
    pid: {p: 30.0, i: 0.0, d: 3.0}
  joint5_controller:
    type: effort_controllers/JointPositionController
    joint: joint5
    pid: {p: 30.0, i: 0.0, d: 2.5}
  joint6_controller:
    type: effort_controllers/JointPositionController
    joint: joint6
    pid: {p: 20.0, i: 0.0, d: 1.0}

  # Gripper controllers (2 prismatic)
  joint7_controller:
    type: effort_controllers/JointPositionController
    joint: joint7
    pid: {p: 20.0, i: 0.0, d: 0.5}
  joint8_controller:
    type: effort_controllers/JointPositionController
    joint: joint8
    pid: {p: 20.0, i: 0.0, d: 0.5}
